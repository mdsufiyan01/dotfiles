[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/power.sh
interval = 5

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;

[module/vpn]
type = custom/script
exec = ip -4 addr show tun0 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}'
interval = 3.0
label-foreground = #8BE9FD
format =%{T4}%{F#8BE9FD}<label>%{F-}%{T-}
format-fail = 

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_


[module/launcher]
type = custom/text

content = 󰣇
;content-foreground = #f8f8f2
;content-background = #44475a
;content-padding = 


click-left = /home/cha/.dotfiles/config/polybar/scripts/launcher.sh
click-right = /home/cha/.dotfiles/config/polybar/scripts/power.sh


